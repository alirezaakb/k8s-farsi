<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="color-scheme" content="light dark">
<title>جزوه کوبرنتیز</title>

<script>(function(){try{var t=localStorage.getItem("jozve-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var r=document.documentElement,g=function(k){return localStorage.getItem("jozve-"+k)};if(g("fs"))r.setAttribute("data-fs",g("fs"));if(g("align"))r.setAttribute("data-align",g("align"));if(g("width"))r.setAttribute("data-width",g("width"));if(g("lh"))r.setAttribute("data-lh",g("lh"));}catch(e){}})();</script>
</head>

<script type="module" src="/src/main.jsx"></script>

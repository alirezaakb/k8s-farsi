<div id="hl-bar" class="hl-ui" role="toolbar" aria-label="هایلایت و یادداشت" hidden>
  <button type="button" class="sw sw-y" data-c="y" aria-label="هایلایت زرد" title="زرد"></button>
  <button type="button" class="sw sw-g" data-c="g" aria-label="هایلایت سبز" title="سبز"></button>
  <button type="button" class="sw sw-b" data-c="b" aria-label="هایلایت آبی" title="آبی"></button>
  <button type="button" class="sw sw-p" data-c="p" aria-label="هایلایت صورتی" title="صورتی"></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="hb" data-act="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>یادداشت</span></button>
  <button type="button" class="hb hl-danger" data-act="del" aria-label="حذف هایلایت" title="حذف هایلایت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  <div class="hl-prev" hidden></div>
</div>
<div id="hl-note-wrap" class="hl-ui hl-wrap" hidden>
  <div id="hl-note" role="dialog" aria-modal="true" aria-labelledby="hl-note-h">
    <h2 id="hl-note-h">یادداشت</h2>
    <blockquote class="hl-q"></blockquote>
    <textarea id="hl-note-t" dir="rtl" aria-label="متن یادداشت" placeholder="یادداشت خود را اینجا بنویسید…"></textarea>
    <div class="hl-row"><button type="button" class="hl-pri" data-act="save">ذخیره</button><button type="button" data-act="cancel">انصراف</button><button type="button" class="hl-danger" data-act="clear">پاک کردن یادداشت</button></div>
    <p class="hl-hint">ذخیره‌ی سریع با <bdi dir="ltr"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></bdi></p>
  </div>
</div>
<div id="nt-wrap" class="hl-ui hl-wrap" hidden>
  <aside id="nt-panel" role="dialog" aria-modal="true" aria-labelledby="nt-h">
    <div class="nt-top"><h2 id="nt-h">یادداشت‌ها و هایلایت‌ها</h2><button type="button" id="nt-close" aria-label="بستن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="nt-tools">
      <input type="search" id="nt-q" dir="rtl" placeholder="جستجو در متن‌ها و یادداشت‌ها" aria-label="جستجو در هایلایت‌ها و یادداشت‌ها">
      <div class="nt-filt">
        <div class="seg" id="nt-f"><button type="button" data-f="all" aria-pressed="true">همه</button><button type="button" data-f="note" aria-pressed="false">فقط یادداشت‌دار</button></div>
        <button type="button" class="sw sw-y" data-fc="y" aria-pressed="false" aria-label="فقط زرد" title="فقط زرد"></button>
        <button type="button" class="sw sw-g" data-fc="g" aria-pressed="false" aria-label="فقط سبز" title="فقط سبز"></button>
        <button type="button" class="sw sw-b" data-fc="b" aria-pressed="false" aria-label="فقط آبی" title="فقط آبی"></button>
        <button type="button" class="sw sw-p" data-fc="p" aria-pressed="false" aria-label="فقط صورتی" title="فقط صورتی"></button>
      </div>
    </div>
    <p class="nt-sum" aria-live="polite"></p>
    <div id="nt-list"></div>
    <div class="nt-foot">
      <button type="button" data-x="md">خروجی Markdown</button>
      <button type="button" data-x="json">پشتیبان JSON</button>
      <button type="button" data-x="imp">بازیابی از فایل JSON</button>
      <button type="button" data-x="clear" class="hl-danger">حذف همه</button>
      <input type="file" id="nt-file" accept=".json,application/json" hidden>
    </div>
  </aside>
</div>
<div id="hl-toast" class="hl-ui" role="status" aria-live="polite" hidden><span></span><button type="button" hidden>بازگردانی</button></div>
